<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>移動中... - わんさかんさい</title>
  <script>
    // 旧URL構造（spot.html?id=xxx）から新URL構造（spots/xxx.html）へリダイレクト
    (function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        // ID指定あり: スポット詳細ページへリダイレクト
        window.location.replace('spots/' + encodeURIComponent(id) + '.html');
      } else {
        // ID指定なし: トップページへ（ソフト404解消）
        window.location.replace('index.html');
      }
    })();
  </script>
  <link rel="canonical" href="https://wansakansai.com/">
</head>
<body>
  <p>リダイレクト中... もし自動的に移動しない場合は<a href="index.html">こちら</a>からトップページへ。</p>
</body>
</html>
